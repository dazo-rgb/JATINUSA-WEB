<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jatinusa | Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navigasi -->
    <nav class="navbar navbar-expand-lg bg-cream border-bottom py-3">
      <div class="container">
        <a class="navbar-brand fs-4 fw-bold text-dark-brown" href="index.html">JATINUSA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto gap-2 gap-lg-3 my-3 my-lg-0 text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="estimator.html">Estimator</a></li>
          </ul>
          <div class="text-center mt-2 mt-lg-0">
            <a href="login.html" class="btn btn-jatinusa px-4 w-100 w-lg-auto">Login</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <!-- Header Halaman Produk -->
      <div class="text-center mb-4 mb-lg-5">
        <h2 class="fw-bold fs-3 fs-lg-2">Produk & Layanan</h2>
        <p class="text-secondary small fs-md-6 px-3">Pilihan furniture kayu jati berkualitas untuk rumah, kantor, dan lainnya.</p>

        <!-- Tombol Buka/Tutup Keranjang -->
        <button class="btn btn-outline-dark mt-3 fw-bold position-relative px-4 py-2 w-100 w-md-auto d-md-inline-block" onclick="toggleCartPanel()">
          🛒 Lihat Keranjang Belanja
          <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"> 0 </span>
        </button>
      </div>

      <!-- ========================================== -->
      <!-- PANEL KERANJANG BELANJA (CART) -->
      <!-- ========================================== -->
      <div id="cartPanel" class="d-none bg-warm-white p-3 p-md-4 rounded-4 shadow border mb-4 mb-lg-5">
        <!-- Header Panel dengan Tombol X -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <h4 class="fw-bold text-dark-brown m-0">🛒 Keranjang Belanja</h4>
          <!-- Tombol X menggunakan class btn-close bawaan Bootstrap -->
          <button type="button" class="btn-close shadow-none" aria-label="Tutup Panel" onclick="toggleCartPanel()"></button>
        </div>

        <!-- Wadah Item Keranjang (Berbasis Card) -->
        <div id="cartItemContainer" class="d-flex flex-column gap-3 mb-4">
          <!-- Item keranjang (Card) akan dirender di sini oleh JavaScript -->
        </div>

        <!-- Bagian Total & Checkout -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-3 border-top gap-3">
          <h4 class="fw-bold mb-0 text-dark-brown text-center text-md-start w-100 w-md-auto">Total: <span id="cartTotal">Rp 0</span></h4>
          <button class="btn btn-success px-4 py-2 fw-bold shadow-sm w-100 w-md-auto" onclick="checkoutCart()">Proses Pesanan (Checkout)</button>
        </div>
      </div>
      <!-- ========================================== -->

      <!-- WADAH PRODUK (KATALOG TOKO) -->
      <div class="row g-3 g-lg-4 justify-content-center" id="dynamicProductContainer">
        <!-- Diisi secara dinamis oleh JavaScript -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-brown text-white py-4 mt-5 text-center">
      <p class="mb-0 small">© 2026 Jatinusa. Crafted by Nature, Made to Last.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
