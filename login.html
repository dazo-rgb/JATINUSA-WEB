<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jatinusa | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-cream border-bottom py-3">
      <div class="container">
        <a class="navbar-brand fs-4 fw-bold text-dark-brown" href="index.html">JATINUSA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto gap-2 gap-lg-3 my-3 my-lg-0 text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="estimator.html">Estimator</a></li>
          </ul>
          <div class="text-center">
            <a href="login.html" class="btn btn-jatinusa px-4">Login</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Ditambahkan my-lg-5 dan py-5 agar halaman teregang lebih panjang ke bawah -->
    <main class="container py-5 my-lg-5">
      <div class="row bg-warm-white rounded-4 shadow-sm overflow-hidden align-items-stretch mb-5">
        <!-- Sisi Kiri: Banner Gambar -->
        <div class="col-lg-5 col-12 login-banner d-flex align-items-center justify-content-center p-4">
          <div class="login-card-box p-4 rounded-3 text-white text-center text-lg-start shadow">
            <h3 class="fw-bold fs-4 mb-2 text-white">Selamat Datang di Jatinusa</h3>
            <p class="small mb-0 text-white-59">Masuk ke akun Anda untuk mengakses berbagai layanan kami.</p>
          </div>
        </div>

        <!-- Sisi Kanan: Form Login & Register -->
        <div class="col-lg-7 col-12 p-4 p-lg-5 d-flex flex-column justify-content-center">
          <!-- Tab Navigasi -->
          <div class="d-flex justify-content-center justify-content-lg-start border-bottom mb-4">
            <h5 id="tabLogin" class="pb-2 border-bottom border-dark border-3 text-dark-brown me-4 fw-bold cursor-pointer" onclick="switchTab('login')" style="cursor: pointer">Login</h5>
            <h5 id="tabRegister" class="pb-2 text-secondary fw-bold cursor-pointer" onclick="switchTab('register')" style="cursor: pointer">Register</h5>
          </div>

          <!-- WRAPPER FORM dengan CSS Grid agar tinggi tidak pernah berubah (statis) -->
          <div style="display: grid; grid-template-columns: 1fr">
            <!-- Bagian Form Login -->
            <div id="formLogin" style="grid-row: 1; grid-column: 1; transition: opacity 0.3s ease; opacity: 1; visibility: visible; pointer-events: auto">
              <form>
                <div class="mb-3">
                  <label class="form-label fw-semibold small">Email</label>
                  <input type="email" class="form-control bg-light py-2" placeholder="Masukkan email Anda" />
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold small">Password</label>
                  <input type="password" class="form-control bg-light py-2" placeholder="Masukkan password Anda" />
                </div>
                <button type="button" class="btn btn-jatinusa w-100 py-2 fw-bold">Login</button>
                <div class="text-center mt-3 small">
                  Belum punya akun?
                  <a
                    href="#"
                    onclick="
                      switchTab('register');
                      return false;
                    "
                    class="text-dark-brown fw-bold text-decoration-none"
                    >Register</a
                  >
                </div>
              </form>
            </div>

            <!-- Bagian Form Register -->
            <div id="formRegister" style="grid-row: 1; grid-column: 1; transition: opacity 0.3s ease; opacity: 0; visibility: hidden; pointer-events: none">
              <form>
                <div class="mb-3">
                  <label class="form-label fw-semibold small">Nama Lengkap</label>
                  <input type="text" class="form-control bg-light py-2" placeholder="Masukkan nama lengkap Anda" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold small">Email</label>
                  <input type="email" class="form-control bg-light py-2" placeholder="Masukkan email Anda" />
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold small">Password</label>
                  <input type="password" class="form-control bg-light py-2" placeholder="Buat password Anda" />
                </div>
                <button type="button" class="btn btn-jatinusa w-100 py-2 fw-bold">Daftar Sekarang</button>
                <div class="text-center mt-3 small">
                  Sudah punya akun?
                  <a
                    href="#"
                    onclick="
                      switchTab('login');
                      return false;
                    "
                    class="text-dark-brown fw-bold text-decoration-none"
                    >Login</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-brown text-white py-4 mt-5 text-center">
      <p class="mb-0 small">© 2026 Jatinusa. Crafted by Nature, Made to Last.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
